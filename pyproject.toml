[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-opennebula-sync"
version = "0.3.0"
description = "NetBox plugin to discover and synchronize OpenNebula infrastructure"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "NetBox OpenNebula Sync contributors" }]
keywords = ["netbox", "opennebula", "ipam", "dcim", "virtualization", "plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx[socks]>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
netbox-opennebula-sync = "netbox_opennebula_sync.cli:main"

[project.urls]
Homepage = "https://github.com/mael-chouteau/netbox-opennebula-sync"
Issues = "https://github.com/mael-chouteau/netbox-opennebula-sync/issues"
Documentation = "https://github.com/mael-chouteau/netbox-opennebula-sync#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netbox_opennebula_sync = [
  "templates/**/*.html",
  "migrations/*.py",
  "management/commands/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
